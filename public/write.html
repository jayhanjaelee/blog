<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Hanjae Lee's Blog - Write</title>
        <link rel="icon" type="image/x-icon" href="/public/favicon.ico">
        <link rel="stylesheet" href="/public/style.css">
        <link rel="stylesheet" href="/public/write.css">
    </head>

    <body>
        <!-- header start -->
        <header class="header-container">
            <div class="header-title">
                <a class="logo" href="/">Hanjae Lee</a>
                <button class="menu-btn">Menu Btn</button>
            </div>
            <div class="header-nav">
                <ul>
                    <li><a href="/">About Me</a></li>
                    <li><a href="/">Posts</a></li>
                    <!-- TODO: uncomment if page created. -->
                    <!-- <li><a href="/about">About Me</a></li> -->
                    <!-- <li><a href="/posts">Posts</a></li> -->
                </ul>
            </div>
        </header>
        <!-- header end -->

        <main>
            <div class="write-container">

                <form action="/ping">
                    <div>
                        <label for="title">제목</label>
                        <input type="text" id="title" name="title" placeholder="Enter title">
                    </div>
                    <div>
                        <label for="content">내용</label>
                        <textarea id="story" name="story" rows="10" cols="100">
                        </textarea>
                    </div>
                    <button type="submit">Save</button>
                </form>

            </div>
        </main>

        <!-- footer start -->
        <footer class="border">
            <span>Copyright © 2026. Hanjae Lee</span>
        </footer>
        <script src="/public/index.js"></script>
        <!-- footer end -->
    </body>
</html>
